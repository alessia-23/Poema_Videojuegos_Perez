<ion-header class="toolbar">

  <ion-toolbar>

    <ion-title>
      Biblioteca Sonora
    </ion-title>

  </ion-toolbar>

</ion-header>
<ion-content class="poema-form-content ion-padding">

  <!-- 🔥 CREATE -->
  <ion-card class="form-card">

    <ion-card-header>
      <ion-card-title>Subir Multimedia</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-list lines="none">

        <ion-item>
          <ion-input label="Título" labelPlacement="stacked" [(ngModel)]="titulo">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Autor" labelPlacement="stacked" [(ngModel)]="autor">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Link YouTube" labelPlacement="stacked" [(ngModel)]="video_url">
          </ion-input>
        </ion-item>

      </ion-list>

      <div class="file-upload">
        <input type="file" accept="audio/*" (change)="onFileSelected($event)" />
      </div>

      <ion-button expand="block" class="btn-guardar" (click)="uploadAudio()">
        Subir
      </ion-button>

    </ion-card-content>
  </ion-card>

  <!-- 🔥 LIST -->
  <ion-card *ngFor="let item of items" class="form-card">

    <ion-card-header>
      <ion-card-title>{{ item.titulo }}</ion-card-title>
      <ion-card-subtitle>{{ item.autor }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <ion-chip class="mini-badge">
        <ion-label>{{ item.fecha }}</ion-label>
      </ion-chip>

      <!-- 🎥 VIDEO -->
      <div class="video-container">
        <iframe width="100%" height="200" [src]="item.video_url | safeUrl" frameborder="0" allowfullscreen>
        </iframe>
      </div>

      <!-- 🎧 AUDIO -->
      <div class="audio-container" *ngIf="item.audio_url">
        <audio controls>
          <source [src]="item.audio_url" type="audio/mpeg">
        </audio>
      </div>


      

      <!-- ACTIONS -->
      <div class="actions">

        <!-- IZQUIERDA -->
        <div class="actions-left">
          <input type="file" (change)="onUpdateFile($event)" />

          <ion-button class="btn-update" size="medium" (click)="updateAudio(item)">
            <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
            Actualizar
          </ion-button>
        </div>

        <!-- DERECHA -->
        <div class="actions-right">
          <ion-button class="btn-delete" size="small" (click)="deleteItem(item)">
            <ion-icon name="trash-outline" slot="start"></ion-icon>
            Eliminar
          </ion-button>
        </div>
      </div>

    </ion-card-content>

  </ion-card>

</ion-content>
